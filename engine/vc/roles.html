<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字角色样张</title>
<!-- 画风入库的第 2、3 张样张(styles/ROADMAP.md):左边 R1–R10 各一行(字体、承载物、出场方式都按画风),右边是统一吉祥物。
     ?style=<id> &t=秒(默认 99 = 全部画完;取中途看出场方式)。1920×1080 一帧。 -->
<link rel="stylesheet" href="fonts.css">
<style>body{margin:0;background:#222}svg{display:block;width:1920px;height:1080px}</style>
</head>
<body>
<div id="out"></div>
<script src="vc.js"></script>
<script src="styles.js"></script>
<script>
const Q = new URLSearchParams(location.search), STYLE = Q.get('style') || 'paper-skeuo', T = +(Q.get('t') ?? 99);
const ROWS = [   // [角色, 名称, 内容]
  ['R1', '开头大字', '只差一张标签'], ['R2', '标题', '第二章 · 实验怎么做'], ['R3', '界面正文 / 标签', '每日摄入 · 第 3 周'],
  ['R4', '大数字', ''], ['R5', '一手原文', '“受试者每日约摄入 1570 千卡。”'], ['R6', '批注', '真的?'],
  ['R7', '角色对白', '先别急着下结论!'], ['R8', '手记', '早餐只吃了一碗米饭'], ['R9', '印章 / 标记物', '已核实'], ['R10', '出处角标', '来源:示意文本,非引文'],
];
const LBL = 'Noto Sans SC:500';
function frame(k, t) {
  const o = [k.backdrop(0, 0, 1920, 1080)], c = k.S.c, dark = (h => (parseInt(h.slice(1, 3), 16) * 299 + parseInt(h.slice(3, 5), 16) * 587 + parseInt(h.slice(5, 7), 16) * 114) / 1000 < 110)(c.bg);
  const lab = dark ? (c.muted || '#aaa') : (c.muted || '#666');
  o.push(`<text x="80" y="70" ${VC.fontAttr('Noto Sans SC:900')} font-size="30" fill="${dark ? (c.text || '#fff') : c.ink}">${VC.esc(k.S.name)} · 文字角色 R1–R10</text>`);
  let y = 150; const H = { R1: 110, R4: 120, R7: 120, R9: 90 };
  ROWS.forEach(([r, name, txt], i) => {
    const h = H[r] || 82, base = y + h * .62, t0 = .3 + i * .35;
    o.push(`<text x="80" y="${base}" ${VC.fontAttr(LBL)} font-size="20" fill="${lab}">${r} ${VC.esc(name)}</text>`);
    const X = 300;
    if (r === 'R1') o.push(k.text('R1', txt, X, base + 14, t, t0, { size: Math.min(80, k.R('R1').size) }));
    else if (r === 'R4') o.push(k.counter([[t0, 1570]], X, base + 30, t, { unit: '千卡', size: Math.min(100, k.R('R4').size) }));
    else if (r === 'R6') { const pre = '1570 千卡 ', w0 = k.width('R8', pre, 40); const m = k.mark(X, base - 38, k.width('R8', '1570', 40), 46, t, t0), tx = k.text('R8', pre, X, base, t, -1, { size: 40, entrance: 'static' }); o.push((k.markUnder ? m + tx : tx + m) + k.text('R6', txt, X + w0 + 10, base, t, t0 + .4)); }
    else if (r === 'R7') o.push(k.bubble(txt, X + 60, base + 40, t, t0, { side: 1 }));
    else if (r === 'R9') o.push(k.stamp(txt, X + 120, base - 8, t, t0, { size: 36 }));
    else o.push(k.text(r, txt, X, base, t, t0));
    y += h;
  });
  // 右边:角色样张(白板画风里是一笔笔画出来的线稿)
  o.push(`<text x="1360" y="300" ${VC.fontAttr(LBL)} font-size="20" fill="${lab}">角色</text>`);
  o.push(k.mascot(1560, 760, t, 3.6));
  o.push(k.bubble('这是我!', 1440, 600, t, 6.2, { side: -1 }));
  return o.join('');
}
window.rolesReady = (async () => {
  const kit = VC.kit(STYLE);
  const rep = await VC.ready(kit, [ROWS.map(r => r.join('')).join('') + '千卡角色这是我!文字角色 R1–R10' + kit.S.name]);
  kit.begin();
  document.getElementById('out').innerHTML = `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs>${kit.defs()}</defs>${frame(kit, T)}</svg>`;
  window.renderAt = t => { kit.begin(); document.getElementById('out').innerHTML = `<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs>${kit.defs()}</defs>${frame(kit, t)}</svg>`; };
  return rep;
})();
</script>
</body>
</html>
